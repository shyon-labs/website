<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══════════════════════════════════════════════
         CORE SEO
    ════════════════════════════════════════════════ -->
    <title>ShyonLabs — AI-Powered Software & Digital Products Studio</title>
    <meta name="description" content="ShyonLabs is a Pakistan-based AI & software product studio building intelligent web apps, mobile experiences, and data-driven digital products for a global audience." />

    <!-- Intentional keyword coverage including common misspellings so Google catches them -->
    <meta name="keywords" content="ShyonLabs, Shyon Labs, Shayan Labs, Shayon Labs, Shion Labs, ShionLabs, software studio Pakistan, AI products, web development, mobile apps, digital products, React, Flutter, AI startup, Mr Shayan, mrshayan, Shayan, mxtr shayan, mxtrshayan, shayan developer, shayan pakistan" />

    <meta name="author" content="ShyonLabs" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="dark" />

    <!-- Canonical -->
    <link rel="canonical" href="https://shyonlabs.tech/" />

    <!-- ═══════════════════════════════════════════════
         OPEN GRAPH (Facebook / LinkedIn / WhatsApp)
    ════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShyonLabs" />
    <meta property="og:title" content="ShyonLabs — AI-Powered Software & Digital Products Studio" />
    <meta property="og:description" content="ShyonLabs builds intelligent web apps, mobile experiences, and AI-powered digital products for a global audience. Based in Pakistan, building for the world." />
    <meta property="og:url" content="https://shyonlabs.tech/" />
    <meta property="og:image" content="https://shyonlabs.tech/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ShyonLabs — AI-Powered Software & Digital Products Studio" />
    <meta property="og:locale" content="en_US" />

    <!-- ═══════════════════════════════════════════════
         TWITTER / X CARD
    ════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShyonLabs — AI-Powered Software & Digital Products Studio" />
    <meta name="twitter:description" content="ShyonLabs builds intelligent web apps, mobile experiences, and AI-powered digital products. Based in Pakistan, building for the world." />
    <meta name="twitter:image" content="https://shyonlabs.tech/og-cover.png" />
    <meta name="twitter:image:alt" content="ShyonLabs — AI-Powered Software & Digital Products Studio" />
    <meta name="twitter:creator" content="@mrshayan" />
    <meta name="twitter:site" content="@shyonlabs" />

    <!-- ═══════════════════════════════════════════════
         MOBILE / PWA
    ════════════════════════════════════════════════ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShyonLabs" />

    <!-- ═══════════════════════════════════════════════
         FAVICON / ICONS
    ════════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />

    <!-- ═══════════════════════════════════════════════
         FONTS (preconnect first for speed)
    ════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ═══════════════════════════════════════════════
         JSON-LD — Organization Schema
         Helps Google understand who ShyonLabs is
    ════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ShyonLabs",
      "alternateName": ["Shyon Labs", "Shayan Labs", "Shayon Labs"],
      "url": "https://shyonlabs.tech",
      "logo": "https://shyonlabs.tech/favicon.svg",
      "description": "ShyonLabs is a Pakistan-based AI & software product studio building intelligent digital products for a global audience.",
      "foundingDate": "2026",
      "foundingLocation": {
        "@type": "Place",
        "addressCountry": "PK",
        "addressLocality": "Pakistan"
      },
      "founder": {
        "@type": "Person",
        "name": "Mr Shayan",
        "alternateName": ["Shayan", "mxtr shayan", "mxtrshayan"],
        "url": "https://pk.linkedin.com/in/mrshayan",
        "sameAs": ["https://pk.linkedin.com/in/mrshayan"]
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "shyonlabs@gmail.com",
        "contactType": "general"
      },
      "sameAs": [
        "https://github.com/shyon-labs",
        "https://pk.linkedin.com/in/mrshayan"
      ],
      "areaServed": "Worldwide",
      "knowsAbout": [
        "Software Development",
        "Artificial Intelligence",
        "Web Applications",
        "Mobile Development",
        "Data Analytics",
        "Cloud Infrastructure"
      ]
    }
    </script>

    <!-- ═══════════════════════════════════════════════
         JSON-LD — WebSite Schema (enables Sitelinks Search Box on Google)
    ════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShyonLabs",
      "url": "https://shyonlabs.tech",
      "description": "ShyonLabs — AI-Powered Software & Digital Products Studio",
      "inLanguage": "en-US"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
